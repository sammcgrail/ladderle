server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Icon probes must never fall through to the SPA (index.html = text/html),
    # or iOS Safari hangs its address-bar progress bar. Serve a clean 204.
    location = /favicon.ico { return 204; }
    location = /apple-touch-icon.png { return 204; }
    location = /apple-touch-icon-precomposed.png { return 204; }

    # long-cache hashed assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
