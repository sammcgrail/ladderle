services:
  ladderle:
    build: .
    container_name: ladderle
    restart: unless-stopped
    # Reuse the pre-existing default bridge instead of creating ladderle_default.
    # Docker's address pools are exhausted (~30 app networks); Caddy reaches this
    # app via host.docker.internal:20069 (published port), not a shared network.
    network_mode: bridge
    ports:
      - "20069:8080"
    mem_limit: 64m
    cpus: 0.2
