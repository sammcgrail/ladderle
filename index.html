    <title>Ladderle — one letter at a time</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // iOS belt-and-suspenders: kill the long-press selection loupe on non-inputs.
      document.addEventListener('selectstart', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
        e.preventDefault();
      });
      // iOS Safari IGNORES user-scalable=no and maximum-scale (by design since
      // iOS 10), so the viewport meta can never stop double-tap zoom there. Only
      // touch-action can — and on a real device `manipulation` was NOT enough on
      // the share area, while the board (touch-action:none) was fine. This cancels
      // the default of a second tap inside 320ms, which is exactly the double-tap
      // gesture. Taps are handled on pointerdown, which fires earlier and is not
      // cancelled, so nothing loses a tap.
      var __lastTouchEnd = 0;
      document.addEventListener(
        'touchend',
        function (e) {
          var now = Date.now();
          if (now - __lastTouchEnd <= 320) e.preventDefault();
          __lastTouchEnd = now;
        },
        { passive: false }
      );
      document.addEventListener('contextmenu', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
        e.preventDefault();
      });
    </script>
  </body>
